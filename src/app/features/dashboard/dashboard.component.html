<div class="pagetitle">
  <h1>Dashboard</h1>
  <nav>
    <ol class="breadcrumb">
      <li class="breadcrumb-item">
        <a (click)="goto('/dashboard')" class="handPointer">Home</a>
      </li>
      <li class="breadcrumb-item active">Dashboard</li>
    </ol>
  </nav>
</div>
<!-- End Page Title -->

<div class="row mb-4">
  <div class="col-lg-12">
    <h2 class="text-center">Welcome to Annoor Foundation School</h2>
  </div>
</div>

<section class="section dashboard">
  <div class="row">
    <div class="col-lg-12">
      <!-- Admission ID Search -->
      <div class="mb-4 d-flex justify-content-start gap-3">
        <div class="col-md-3">
          <input type="text" class="form-control" placeholder="Enter Admission ID" >
        </div>
        <div class="col-md-2">
          <button class="btn btn-primary" (click)="searchByAdmissionId()">
            <i class="bi bi-search"></i> Search
          </button>
        </div>
      </div>

      <!-- Existing Dropdowns -->
      <div class="mb-2 d-flex justify-content-start gap-3">
        <div class="col-md-3">
          <select class="form-select">
            <option value="">Select Class</option>
            <option *ngFor="let class of classes" [value]="class.id">{{class.name}}</option>
          </select>
        </div>
        <div class="col-md-3">
          <select class="form-select">
            <option value="">Select Section</option>
            <option *ngFor="let section of sections" [value]="section.id">{{section.name}}</option>
          </select>
        </div>
        <div class="col-md-3">
          <select class="form-select">
            <option value="">Select Student</option>
            <option *ngFor="let student of students" [value]="student.id">{{student.name}}</option>
          </select>
        </div>
        <div class="col-md-2">
          <button class="btn btn-primary" (click)="search()">
            <i class="bi bi-search"></i> Search
          </button>
        </div>
      </div>

      <!-- Student Data Table -->
      <div class="table-responsive mt-4">
        <table class="table table-striped table-bordered">
          <thead class="table-primary">
            <tr>
              <th>Admission ID</th>
              <th>Student Name</th>
              <th>Class</th>
              <th>Section</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let student of studentData">
              <td>{{student.admissionId}}</td>
              <td>{{student.name}}</td>
              <td>{{student.class}}</td>
              <td>{{student.section}}</td>
              <td>
                <button class="btn btn-success btn-sm" (click)="payFee(student)">
                  <i class="bi bi-currency-dollar"></i> Pay Fee
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
